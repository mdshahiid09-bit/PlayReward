name: Build PlayReward Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish APK as a GitHub Release (triggers in-app forced update)"
        required: false
        default: "false"
        type: choice
        options: [ "false", "true" ]
      release_tag:
        description: "Release tag (e.g. v1.0.1) if publishing a release"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore google-services.json from Secret (if not committed)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
              echo "Restored app/google-services.json from secret."
            else
              echo "ERROR: app/google-services.json is missing. Add it to app/ or set GOOGLE_SERVICES_JSON_BASE64 secret."
              exit 1
            fi
          fi

      - name: Decode Release Keystore (or generate temporary CI keystore)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/playreward-release.jks
            echo "KEYSTORE_FILE=playreward-release.jks" >> $GITHUB_ENV
          else
            echo "SIGNING_KEYSTORE_BASE64 not set; generating temporary signing keystore for CI build."
            keytool -genkeypair -v -keystore app/playreward-release.jks \
              -alias playreward -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass playreward123 -keypass playreward123 \
              -dname "CN=PlayReward, OU=App, O=PlayReward, L=Patna, S=Bihar, C=IN"
            echo "KEYSTORE_FILE=playreward-release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=playreward123" >> $GITHUB_ENV
            echo "KEY_ALIAS=playreward" >> $GITHUB_ENV
            echo "KEY_PASSWORD=playreward123" >> $GITHUB_ENV
          fi

      - name: Build Debug & Signed Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayReward-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayReward-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (on tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
          name: "PlayReward ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}"
          body: "Automated PlayReward Android release built via GitHub Actions."
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
